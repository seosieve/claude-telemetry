name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets CI be run from the Actions tab without a push — the only way to
  # check the suite on demand, e.g. after re-enabling Actions on this fork.
  workflow_dispatch:

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd agent
          pip install -e ".[dev]"
          pytest -v

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          cd dashboard
          npm ci
          npm run build
